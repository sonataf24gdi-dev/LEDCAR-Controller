name: Build LEDCAR APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect repository
        shell: bash
        run: |
          echo "=== Repository files ==="
          ls -la

          echo "=== Android project files ==="
          find . -maxdepth 5 -type f | sort | head -n 100

      - name: Restore Android project structure
        shell: bash
        run: |
          echo "Restoring Android project structure..."

          mkdir -p app/src/main
          mkdir -p app/src/main/java/com/ledcar/ambient

          if [ -f AndroidManifest.xml ] && \
             [ ! -f app/src/main/AndroidManifest.xml ]; then
            cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          fi

          if [ -f MainActivity.java ] && \
             [ ! -f app/src/main/java/com/ledcar/ambient/MainActivity.java ]; then
            cp MainActivity.java \
              app/src/main/java/com/ledcar/ambient/MainActivity.java
          fi

          if [ ! -f app/build.gradle ] && \
             [ ! -f app/build.gradle.kts ]; then

            cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.ledcar.ambient'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.ledcar.ambient'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '0.1'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF
          fi

          echo "Project structure ready."

      - name: Validate project files
        shell: bash
        run: |
          echo "=== Checking project files ==="

          if [ ! -f settings.gradle ] && \
             [ ! -f settings.gradle.kts ]; then
            echo "ERROR: settings.gradle missing"
            exit 1
          fi

          if [ ! -f app/build.gradle ] && \
             [ ! -f app/build.gradle.kts ]; then
            echo "ERROR: app/build.gradle missing"
            exit 1
          fi

          if [ ! -f app/src/main/AndroidManifest.xml ]; then
            echo "ERROR: AndroidManifest.xml missing"
            exit 1
          fi

          echo "All required project files found."

      - name: Fix Manifest leading whitespace
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/AndroidManifest.xml")
          data = path.read_bytes()

          if data.startswith(b"\xef\xbb\xbf"):
              data = data[3:]

          data = data.lstrip(b" \t\r\n")

          path.write_bytes(data)

          print("Manifest first bytes:", data[:16].hex(" "))
          PY

      - name: Check Manifest XML syntax
        shell: bash
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          path = Path("app/src/main/AndroidManifest.xml")

          try:
              ET.parse(path)
              print("RESULT: XML SYNTAX OK")

          except ET.ParseError as error:
              print("RESULT: XML SYNTAX FAILED")
              print("ERROR:", error)

              line, column = error.position
              print("LINE:", line)
              print("COLUMN:", column)

              lines = path.read_text(
                  encoding="utf-8",
                  errors="replace"
              ).splitlines()

              start = max(0, line - 4)
              end = min(len(lines), line + 3)

              for i in range(start, end):
                  print(f"{i + 1}: {lines[i]}")

              raise SystemExit(1)
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
              -name sdkmanager -type f | head -n 1)
          fi

          "$SDKMANAGER" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        shell: bash
        run: |
          set +e

          gradle --no-daemon \
            :app:assembleDebug \
            --console=plain \
            > build.log 2>&1

          RESULT=$?

          echo "================================"
          echo "BUILD ERROR SUMMARY"
          echo "================================"

          grep -n -i -E \
            'FAILED|error:|what went wrong|execution failed|caused by|exception|cannot find symbol|symbol:|location:' \
            build.log | tail -n 80 || true

          echo "================================"
          echo "LAST 80 LOG LINES"
          echo "================================"

          tail -n 80 build.log

          echo "================================"
          echo "BUILD RESULT"
          echo "================================"

          if [ "$RESULT" -eq 0 ]; then
            echo "BUILD SUCCESSFUL"
          else
            echo "BUILD FAILED"
            echo "Exit code: $RESULT"
          fi

          exit "$RESULT"

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: LEDCAR-Build-Error-Log
          path: build.log
          if-no-files-found: ignore

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LEDCAR-Controller-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
