name: Build LEDCAR APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Android project structure
        run: |
          mkdir -p app/src/main/java/com/example/ledcar
          if [ -f AndroidManifest.xml ]; then
            mv AndroidManifest.xml app/src/main/AndroidManifest.xml
          fi
          if [ -f MainActivity.java ]; then
            mv MainActivity.java app/src/main/java/com/example/ledcar/MainActivity.java
          fi
          if [ ! -f app/build.gradle ]; then
            cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.example.ledcar'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.example.ledcar'
                  minSdk 26
                  targetSdk 35
                  versionCode 1
                  versionName '0.1'
              }
          }
          EOF
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LEDCAR-Controller-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
