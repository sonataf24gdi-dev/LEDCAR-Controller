
name: Build LEDCAR APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect repository structure
        shell: bash
        run: |
          echo "=== Repository files ==="
          pwd
          ls -la

          echo "=== Android project files ==="
          find . -maxdepth 5 -type f | sort | head -n 150

      - name: Restore Android project structure
        shell: bash
        run: |
          echo "Restoring Android project structure..."

          mkdir -p app/src/main
          mkdir -p app/src/main/java/com/ledcar/ambient

          if [ -f AndroidManifest.xml ]; then
            if [ ! -f app/src/main/AndroidManifest.xml ]; then
              cp AndroidManifest.xml app/src/main/AndroidManifest.xml
              echo "Restored AndroidManifest.xml"
            else
              echo "Using existing AndroidManifest.xml"
            fi
          fi

          if [ -f MainActivity.java ]; then
            if [ ! -f app/src/main/java/com/ledcar/ambient/MainActivity.java ]; then
              cp MainActivity.java app/src/main/java/com/ledcar/ambient/MainActivity.java
              echo "Restored MainActivity.java"
            else
              echo "Using existing MainActivity.java"
            fi
          fi

          if [ ! -f app/build.gradle ] && \
             [ ! -f app/build.gradle.kts ]; then

            echo "Creating app/build.gradle"

            cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.ledcar.ambient'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.ledcar.ambient'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '0.1'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF
          fi

          echo "Project restoration finished."

      - name: Validate project files
        shell: bash
        run: |
          echo "=== Gradle settings ==="

          if [ -f settings.gradle ]; then
            echo "OK: settings.gradle"
          elif [ -f settings.gradle.kts ]; then
            echo "OK: settings.gradle.kts"
          else
            echo "WARNING: Gradle settings missing"
          fi

          echo "=== App Gradle configuration ==="

          if [ -f app/build.gradle ] || \
             [ -f app/build.gradle.kts ]; then
            echo "OK: App Gradle configuration"
          else
            echo "ERROR: App Gradle configuration missing"
            exit 1
          fi

          echo "=== AndroidManifest.xml ==="

          if [ -f app/src/main/AndroidManifest.xml ]; then
            echo "OK: AndroidManifest.xml"
          else
            echo "ERROR: AndroidManifest.xml missing"
            exit 1
          fi

          echo "=== Manifest file information ==="
          file app/src/main/AndroidManifest.xml

          echo "=== Manifest first bytes ==="
          od -An -tx1 -N32 app/src/main/AndroidManifest.xml

      - name: Check Manifest XML syntax
        shell: bash
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          path = Path("app/src/main/AndroidManifest.xml")

          print("================================")
          print("AndroidManifest.xml syntax check")
          print("================================")

          data = path.read_bytes()

          print("File size:", len(data), "bytes")
          print("First 32 bytes:", data[:32].hex(" "))

          try:
              ET.parse(path)
              print("RESULT: XML SYNTAX OK")

          except ET.ParseError as error:
              print("RESULT: XML SYNTAX FAILED")
              print("ERROR:", error)

              line_number, column = error.position

              print("LINE:", line_number)
              print("COLUMN:", column)

              lines = data.decode(
                  "utf-8",
                  errors="replace"
              ).splitlines()

              start = max(0, line_number - 4)
              end = min(len(lines), line_number + 3)

              print("=== Error context ===")

              for i in range(start, end):
                  marker = ">>" if i + 1 == line_number else "  "
                  print(
                      f"{marker} {i + 1}: {lines[i]}"
                  )

              raise SystemExit(1)

          except Exception as error:
              print("RESULT: XML CHECK FAILED")
              print("ERROR:", repr(error))
              raise SystemExit(1)
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
              -name sdkmanager -type f | head -n 1)
          fi

          "$SDKMANAGER" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        shell: bash
        run: |
          gradle --no-daemon \
            :app:assembleDebug \
            --stacktrace \
            --info

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LEDCAR-Controller-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
